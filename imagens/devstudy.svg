  <!-- Título -->
  <text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#f5f5f5">DevStudy</text>
  <text x="62" y="236" font-family="Consolas, monospace" font-size="22" fill="#cf67ff">&gt; organize seus estudos</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#a5a5ad">
