<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Capa do projeto DevStudy">
  <defs>
    <radialGradient id="brilho" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#b829ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b829ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="400" fill="#121216"/>
  <rect width="960" height="400" fill="url(#brilho)"/>

  <!-- Cartões de estudo empilhados -->
  <g transform="translate(560 70)">
    <rect x="30" y="30" width="300" height="190" rx="16" fill="#1c1c22" stroke="#27272d"/>
    <rect x="15" y="15" width="300" height="190" rx="16" fill="#17171c" stroke="#33333b"/>
    <rect width="300" height="190" rx="16" fill="#0e0e11" stroke="#b829ff" stroke-opacity="0.6"/>
    <text x="24" y="42" font-family="Consolas, monospace" font-size="14" fill="#cf67ff">flashcard</text>
    <rect x="24" y="64" width="220" height="10" rx="5" fill="#33333b"/>
    <rect x="24" y="88" width="170" height="10" rx="5" fill="#33333b"/>
    <rect x="24" y="130" width="90" height="34" rx="8" fill="#b829ff"/>
    <rect x="124" y="130" width="90" height="34" rx="8" fill="none" stroke="#33333b"/>
  </g>

  <!-- Barras de progresso -->
  <g transform="translate(560 310)">
    <rect width="330" height="10" rx="5" fill="#1c1c22"/>
    <rect width="230" height="10" rx="5" fill="#b829ff"/>
