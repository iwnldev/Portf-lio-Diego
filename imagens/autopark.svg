<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Capa do projeto AutoParK">
  <defs>
    <radialGradient id="brilho" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#b829ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b829ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="400" fill="#121216"/>
  <rect width="960" height="400" fill="url(#brilho)"/>

  <!-- Vagas do pátio: roxo = ocupada, contorno = livre -->
  <g transform="translate(540 60)" stroke="#33333b">
    <g fill="#b829ff" fill-opacity="0.85" stroke="none">
      <rect x="0" y="0" width="80" height="120" rx="8"/>
      <rect x="180" y="0" width="80" height="120" rx="8"/>
      <rect x="270" y="0" width="80" height="120" rx="8"/>
      <rect x="90" y="190" width="80" height="120" rx="8"/>
      <rect x="270" y="190" width="80" height="120" rx="8"/>
    </g>
    <g fill="#0e0e11">
      <rect x="90" y="0" width="80" height="120" rx="8"/>
      <rect x="0" y="190" width="80" height="120" rx="8"/>
      <rect x="180" y="190" width="80" height="120" rx="8"/>
    </g>
    <text x="0" y="160" font-family="Consolas, monospace" font-size="14" fill="#a5a5ad" stroke="none">vagas: ocupadas / livres</text>
  </g>

  <!-- Título -->
  <text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#f5f5f5">AutoParK</text>
  <text x="62" y="236" font-family="Consolas, monospace" font-size="22" fill="#cf67ff">&gt; gestão de estacionamento</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#a5a5ad">
    <text x="62" y="300">MySQL · SQL · Python · PHP</text>
  </g>
</svg>
